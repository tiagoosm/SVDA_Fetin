[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["api"]
omit = ["api/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["interface/vendor"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["api", "conftest"]
