<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="assets/Icon.png"/>
  <title>Cadastre-se</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Nunito:wght@700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="assets/BotaoBack.png" alt="direita" class="back-btn-register" onclick="window.location.href='index.html'"/>
  </header>

  <div class="register-card">
    <div class="container">
      <img src="assets/Bull.png" alt="icon" class="bull" />
    </div>

    <h2 class="register-title">Crie uma conta</h2>

    <form class="form-register" id="form-register">
      <div class="register-form">
        <div class="register-column">
          <input id="nome" type="text" placeholder="Nome Completo" maxlength="100" required>
          <input id="email" type="email" placeholder="E-mail" required>
          <input id="senha" type="password" placeholder="Crie uma Senha (mín. 8 caracteres)" minlength="8" maxlength="128" required>
        </div>
        <div class="register-column">
          <select id="tamanho" required>
            <option value="" disabled selected>Tamanho do Rebanho</option>
            <option value="Pequeno">Pequeno</option>
            <option value="Médio">Médio</option>
            <option value="Grande">Grande</option>
          </select>
          <select id="tipo" required>
            <option value="" disabled selected>Tipo de Gado</option>
            <option value="Leite">Leite</option>
            <option value="Corte">Corte</option>
            <option value="Outro">Outro</option>
          </select>
          <input id="convite" type="text" placeholder="Código de convite (se tiver)" maxlength="100" autocomplete="off">
        </div>
      </div>

      <button type="submit" class="register-btn">Cadastrar</button>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    const form = document.getElementById('form-register');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const body = {
        nome: document.getElementById('nome').value.trim(),
        email: document.getElementById('email').value.trim(),
        senha: document.getElementById('senha').value,
        tamanho_rebanho: document.getElementById('tamanho').value,
        tipo_gado: document.getElementById('tipo').value,
        codigo_convite: document.getElementById('convite').value.trim(),
      };

      try {
        const { ok, data } = await apiFetch('/register', { method: 'POST', body, redirectOn401: false });
        if (!ok) {
          alert(data.erro || 'Erro ao cadastrar');
          return;
        }

        alert('Cadastro realizado com sucesso! Faça login para continuar.');
        window.location.href = 'index.html';
      } catch (err) {
        console.error(err);
        alert('Falha ao conectar com o servidor.');
      }
    });
  </script>
</body>
</html>
